[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-domain"
version = "0.1.0"
description = "Shared domain package for Fashion Search POC: settings, DB access, normalization rules"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "PyYAML==6.0.3",
  "boto3==1.43.106",
]

[tool.setuptools.packages.find]
include = ["fashion_domain*"]
