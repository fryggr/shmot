[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-api"
version = "0.1.0"
description = "Public and internal HTTP API for Fashion Search POC"
requires-python = ">=3.11"
dependencies = [
  "fashion-domain",
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "redis==8.1.0",
]

[tool.setuptools.packages.find]
include = ["fashion_api*"]
